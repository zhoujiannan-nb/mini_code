<script>
(function () {
  var seen = 0;
  function show(msg) {
    if (seen++ > 3) return; // 刷屏时保留前几条现场
    var box = document.getElementById("mc-fatal");
    if (!box) {
      box = document.createElement("div");
      box.id = "mc-fatal";
      box.style.cssText = "position:fixed;top:8px;left:50%;transform:translateX(-50%);"
        + "z-index:2147483647;background:#c62828;color:#fff;font:12px/1.6 system-ui,sans-serif;"
        + "padding:8px 14px;border-radius:8px;max-width:82%;box-shadow:0 6px 24px rgba(0,0,0,.4);"
        + "white-space:pre-wrap;word-break:break-all";
      (document.body || document.documentElement).appendChild(box);
    }
    box.textContent = (box.textContent ? box.textContent + "\n" : "") + "⚠ 页面出错: " + msg;
  }
  function short(u) { return String(u || "").split(/[\\/]/).pop(); }
  // Preact 的错误兜底是把异常原样再抛一次,于是 event.filename 只剩 preact.js —
  // 第一现场只在 error.stack 里。线上没有 F12 时这条横幅就是唯一线索,把它带上。
  function frames(err) {
    var s = err && err.stack ? String(err.stack).split("\n") : [];
    var out = [];
    for (var i = 1; i < s.length && out.length < 2; i++) {
      var f = String(s[i] || "").trim().replace(/^at\s+/, "").replace(/\((\w+):\/[^)]*\/(js\/[^)]+)\)/, "($2)");
      if (f) out.push(f);
    }
    return out;
  }
  window.addEventListener("error", function (e) {
    if (e.target && e.target !== window && (e.target.src || e.target.href)) {
      show("资源加载失败: " + short(e.target.src || e.target.href));
      return;
    }
    var f = frames(e.error);
    show((e.message || "script error")
      + (e.filename ? "  (" + short(e.filename) + ":" + e.lineno + ")" : "")
      + (f.length ? "\n  " + f.join("\n  ") : ""));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    show("Promise 出错: " + ((r && (r.message || r)) || "unknown"));
  });
})();
</script>
