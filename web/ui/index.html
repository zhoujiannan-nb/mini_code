<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Code</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --border: #e2e8f0;
  --border2: #cbd5e1;
  --text: #1e293b;
  --text2: #64748b;
  --text3: #94a3b8;
  --green: #16a34a;
  --green-d: #15803d;
  --green-l: #dcfce7;
  --green-xl: #f0fdf4;
  --green-b: #bbf7d0;
  --blue-l: #eff6ff;
  --blue-t: #1d4ed8;
  --amber: #f59e0b;
  --red: #ef4444;
  --red-l: #fef2f2;
  --red-b: #fecaca;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
/* 滚动条:与浅色主题一致 */
* { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
html, body { height: 100%; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}

/* ---------- 顶部栏 ---------- */
header {
  flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
  background: #fff; border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
  padding: 12px 20px; z-index: 10;
}
.logo { font-size: 18px; font-weight: 700; color: var(--text); }
.logo span { color: var(--green); }
.pill {
  font-size: 12px; color: var(--text2); background: var(--bg);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px;
  max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pill b { color: var(--text); font-weight: 600; }
.pill .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.dot.on { background: #22c55e; }
.dot.off { background: var(--border2); }
.spacer { flex: 1; }
.icon-btn {
  background: #fff; color: var(--text2); border: 1px solid var(--border2);
  border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
}
.icon-btn:hover { border-color: var(--green); color: var(--green); }

/* ---------- 布局 ---------- */
main { flex: 1; display: flex; min-height: 0; }
aside {
  width: 290px; flex: 0 0 290px; background: #fff;
  border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0;
}
.new-btn {
  margin: 12px; padding: 10px; background: var(--green); color: #fff;
  border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600;
}
.new-btn:hover { background: var(--green-d); }
.sess-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.sess-item {
  padding: 10px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
  border: 1px solid transparent; position: relative;
}
.sess-item:hover { background: var(--bg); }
.sess-item.active { background: var(--green-xl); border-color: var(--green-b); }
.sess-title {
  font-size: 13px; font-weight: 600; color: #0f172a; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; padding-right: 44px;
}
.sess-meta { font-size: 11px; color: var(--text3); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
.sess-meta .s { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.s.running { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
.s.completed { background: #22c55e; }
.s.failed { background: var(--red); }
.s.interrupted { background: var(--amber); }
.s.idle { background: var(--border2); }
.del-btn {
  position: absolute; right: 8px; top: 8px; width: 20px; height: 20px;
  border: none; border-radius: 5px; background: transparent; color: var(--text3);
  font-size: 13px; cursor: pointer; display: none; line-height: 20px;
}
.sess-item:hover .del-btn { display: block; }
.del-btn:hover { background: var(--red); color: #fff; }
.rename-btn {
  position: absolute; right: 32px; top: 8px; width: 20px; height: 20px;
  border: none; border-radius: 5px; background: transparent; color: var(--text3);
  font-size: 12px; cursor: pointer; display: none; line-height: 20px;
}
.sess-item:hover .rename-btn { display: block; }
.rename-btn:hover { background: var(--blue-t); color: #fff; }
.empty-hint { color: var(--text3); font-size: 12px; text-align: center; padding: 24px 12px; }

/* ---------- 聊天区 ---------- */
.chat { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.chat-head {
  height: 44px; flex: 0 0 44px; display: flex; align-items: center; padding: 0 20px; gap: 10px;
  background: #fff; border-bottom: 1px solid var(--border);
  font-size: 13px; color: var(--text3);
}
.chat-head .title { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.messages { flex: 1; overflow-y: auto; padding: 20px 24px; scroll-behavior: smooth; }

/* 消息:统一的纵向卡片排布 */
.msg { margin-bottom: 12px; }
.m-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px;
}
.m-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.m-tag { font-size: 11px; font-weight: 600; border-radius: 5px; padding: 2px 8px; }
.m-tag.user { background: var(--green-l); color: var(--green-d); }
.m-tag.ai { background: var(--blue-l); color: var(--blue-t); }
.m-text { font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; color: var(--text); }
.msg.user .m-card { background: var(--green-xl); border-color: var(--green-b); }

/* 思考过程:浅色字,与正文同列排布 */
details.m-think { margin-bottom: 8px; }
details.m-think summary {
  cursor: pointer; font-size: 12px; color: var(--text3); user-select: none; list-style: none;
}
details.m-think summary::-webkit-details-marker { display: none; }
details.m-think summary::before { content: "▸ "; }
details.m-think[open] summary::before { content: "▾ "; }
details.m-think[open] summary { margin-bottom: 6px; }
.think-body {
  color: var(--text3); font-size: 12.5px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
  max-height: 280px; overflow-y: auto;
  border-top: 1px dashed var(--border); padding-top: 8px;
}
.m-think-live {
  display: none; color: var(--text3); font-size: 12.5px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
  max-height: 200px; overflow-y: auto;
  border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 2px;
}

/* 工具调用 */
.msg.tool .m-card { background: #f8fafc; padding: 8px 12px; font-family: Consolas, monospace; font-size: 12px; }
.t-name { font-weight: 700; color: #334155; }
.t-args { color: var(--text3); word-break: break-all; }
.t-res { color: var(--text3); margin-top: 4px; word-break: break-all; white-space: pre-wrap; }

/* 错误 / 状态 */
.msg.error .m-card { background: var(--red-l); border-color: var(--red-b); }
.msg.error .m-text { color: #b91c1c; font-size: 13px; }
.msg.status .m-card { background: transparent; border: none; padding: 0; }
.msg.status .m-text { color: var(--text3); font-size: 12px; }

/* 实时指示 */
.live-ind { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
.pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.2s ease-in-out infinite; }
.pulse.gray { background: var(--border2); }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

/* 等待模型首 token(大上下文冷启动)的转圈提示 */
.msg.pending .m-card {
  display: flex; align-items: center; gap: 10px;
  background: var(--green-xl); border-color: var(--green-b);
  color: var(--text2); font-size: 13px;
}
.spinner {
  width: 16px; height: 16px; flex: 0 0 16px; border-radius: 50%;
  border: 2px solid var(--green-b); border-top-color: var(--green);
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.pending-sec { color: var(--text3); font-size: 12px; font-variant-numeric: tabular-nums; }

.placeholder {
  height: 100%; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: var(--text3); gap: 10px;
}
.placeholder .big { font-size: 40px; }
.placeholder p { font-size: 14px; }

/* ---------- 输入区 ---------- */
.composer {
  flex: 0 0 auto; padding: 12px 24px 8px; background: var(--bg);
  position: relative;
}
/* 圆角卡片容器 */
.composer-box {
  background: #fff; border: 1px solid var(--border); border-radius: 16px;
  padding: 10px 12px; box-shadow: 0 2px 10px rgba(15,23,42,.05);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.composer-box:focus-within {
  border-color: var(--border2);
  box-shadow: 0 4px 16px rgba(15,23,42,.09);
}

/* @ 文件夹选择器(弹出在输入框上方) */
.fs-picker {
  position: absolute; bottom: calc(100% - 4px); left: 24px; right: 24px;
  background: #fff; border: 1px solid var(--border2); border-radius: 12px;
  box-shadow: 0 -8px 28px rgba(15,23,42,.14); z-index: 40; overflow: hidden;
}
.fs-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--text2); background: #f8fafc;
}
.fs-head .fs-q { color: var(--green-d); font-weight: 600; font-family: Consolas, monospace; }
.fs-head .fs-hint { margin-left: auto; color: var(--text3); font-size: 11px; }
.fs-list { max-height: 280px; overflow-y: auto; padding: 4px; }
.fs-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.fs-item:hover { background: var(--bg); }
.fs-item.sel { background: var(--green-xl); outline: 1px solid var(--green-b); }
.fs-name { font-size: 13px; font-weight: 600; color: var(--text); }
.fs-path { font-size: 11.5px; color: var(--text3); font-family: Consolas, monospace; margin-top: 2px; word-break: break-all; }
.fs-empty { padding: 14px 12px; font-size: 12.5px; color: var(--text3); text-align: center; }
.composer-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.composer-row .row-flex { flex: 1; }

/* 粘贴截图的缩略图预览 */
.img-previews { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.img-prev {
  position: relative; width: 72px; height: 72px; border-radius: 8px;
  border: 1px solid var(--border2); overflow: hidden; background: var(--bg);
}
.img-prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-prev .rm {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: rgba(15,23,42,.72); color: #fff;
  font-size: 12px; line-height: 18px; text-align: center; cursor: pointer;
  border: none; padding: 0;
}
.img-prev .rm:hover { background: var(--red); }
.msg-imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.msg-imgs img {
  max-width: 240px; max-height: 180px; border-radius: 8px;
  border: 1px solid var(--border2); cursor: zoom-in;
}
.composer-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 8px; padding: 0 2px; font-size: 11px; color: var(--text3);
}
.token-usage { font-variant-numeric: tabular-nums; }
.token-usage.warn { color: var(--amber); font-weight: 600; }
.foot-hint { opacity: .8; }
.compact-btn {
  background: #fff; color: var(--text2); border: 1px solid var(--border2);
  border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer;
}
.compact-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
.compact-btn:disabled { opacity: .4; cursor: not-allowed; }
.composer textarea {
  width: 100%; resize: none; background: transparent; color: var(--text);
  border: none; padding: 4px 4px 0;
  font-size: 14px; font-family: inherit; line-height: 1.5; max-height: 160px; outline: none;
}
.send-btn, .stop-btn {
  height: 34px; padding: 0 18px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.send-btn { background: var(--green); color: #fff; border: 1px solid var(--green); }
.send-btn:hover:not(:disabled) { background: var(--green-d); }
.send-btn:disabled { opacity: .45; cursor: not-allowed; }
.plus-btn {
  width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; cursor: pointer;
  background: #f1f5f9; border: none; color: #475569;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s ease, color .15s ease;
}
.plus-btn:hover:not(:disabled) { background: #e2e8f0; color: #1e293b; }
.plus-btn:disabled { opacity: .45; cursor: not-allowed; }
.stop-btn { background: #fff; border: 1px solid var(--red); color: var(--red); display: none; }
.stop-btn:hover { background: var(--red-l); }

/* ---------- 配置弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15,23,42,.55);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.modal-mask.open { display: flex; }
.modal {
  width: 640px; max-width: 94vw; max-height: 88vh; overflow-y: auto;
  background: #fff; border-radius: 14px; padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  animation: pop .16s ease-out;
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal h2 { font-size: 17px; margin-bottom: 6px; }
.modal h3 {
  font-size: 13px; font-weight: 600; color: #334155; margin: 18px 0 10px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.frow { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
.frow label { width: 140px; flex: 0 0 140px; font-size: 13px; color: var(--text2); }
.frow input[type=text], .frow input[type=password], .frow input[type=number] {
  flex: 1; background: #fff; border: 1px solid var(--border2); color: var(--text);
  border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none; min-width: 0;
}
.frow input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(22,163,74,.12); }
.frow .hint { font-size: 11px; color: var(--text3); }
.check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
/* 模型列表卡片(设置弹窗) */
.model-card {
  border: 1px solid var(--border); border-radius: 10px; padding: 12px;
  margin-bottom: 10px; background: var(--bg);
}
.model-card .mc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
.model-card .mc-head b { color: #0f172a; }
.model-card .mc-rm {
  margin-left: auto; width: 22px; height: 22px; border: none; border-radius: 6px;
  background: transparent; color: var(--text3); font-size: 13px; cursor: pointer;
}
.model-card .mc-rm:hover { background: var(--red); color: #fff; }
.add-model-btn {
  width: 100%; padding: 8px; border: 1px dashed var(--border2); border-radius: 10px;
  background: transparent; color: var(--text2); font-size: 13px; cursor: pointer; margin-bottom: 12px;
}
.add-model-btn:hover { border-color: var(--green); color: var(--green); }
.frow select {
  flex: 1; background: #fff; border: 1px solid var(--border2); color: var(--text);
  border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none; min-width: 0;
}
/* 模型选择(composer 输入行内,发送按钮左侧) */
.model-menu-wrap { position: relative; display: inline-flex; align-items: center; }
.model-inline-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: none; cursor: pointer;
  font-size: 13px; color: var(--text2); padding: 6px 10px; border-radius: 8px;
  max-width: 240px;
}
.model-inline-btn:hover { background: var(--bg); color: var(--text); }
.model-inline-btn #model-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-inline-btn .chev { font-size: 12px; color: var(--text3); flex: none; }
.model-menu {
  position: absolute; bottom: 38px; right: 0; z-index: 60; min-width: 220px; max-height: 320px; overflow-y: auto;
  background: #fff; border: 1px solid var(--border2); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(15,23,42,.18); display: none;
}
.model-menu.open { display: block; }
.model-menu .mm-item { padding: 8px 14px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.model-menu .mm-item:hover { background: var(--bg); }
.model-menu .mm-item.cur { color: var(--green-d); font-weight: 600; }
.model-menu .mm-item .mm-sub { font-size: 11px; color: var(--text3); margin-left: auto; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.btn {
  padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border2);
  background: #fff; color: var(--text2); font-size: 13px; cursor: pointer;
}
.btn:hover { border-color: var(--green); color: var(--green); }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--green-d); }

/* ---------- 提示 ---------- */
#toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  background: #fff; border: 1px solid var(--border); color: var(--text);
  padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 99;
  box-shadow: 0 6px 16px rgba(0,0,0,.1);
  opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 80vw;
}
#toast.show { opacity: 1; }
#toast.ok { border-color: var(--green-b); color: var(--green-d); background: var(--green-xl); }
#toast.err { border-color: var(--red-b); color: #b91c1c; background: var(--red-l); }

/* ---------- 模式切换 ---------- */
.mode-btn {
  background: #fff; color: var(--text2); border: 1px solid var(--border2);
  border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer;
}
.mode-btn:hover { border-color: var(--green); color: var(--green); }
.mode-btn.cautious { border-color: var(--amber); color: #b45309; background: #fffbeb; }
.mode-btn.cautious:hover { border-color: #d97706; }

/* ---------- 审批 ---------- */
.approval-badge {
  background: var(--red); color: #fff; border: none; border-radius: 999px;
  padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  display: none;
}
.approval-badge.show { display: inline-block; animation: pulse 1.2s ease-in-out infinite; }
.approval-modal { width: 540px; }
.ap-head { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.ap-sess { font-size: 12.5px; color: var(--text2); margin-bottom: 12px; }
.ap-tool {
  font-family: Consolas, monospace; font-size: 12.5px;
  background: #0f172a; color: #e2e8f0; border-radius: 8px;
  padding: 12px; max-height: 240px; overflow-y: auto;
  white-space: pre-wrap; word-break: break-all;
}
.ap-tool .ap-tname { color: #fbbf24; font-weight: 700; }
.ap-deadline { font-size: 11.5px; color: var(--text3); margin-top: 10px; font-variant-numeric: tabular-nums; }
.ap-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.btn.danger { background: #fff; border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: var(--red-l); }

/* ---------- 子任务面板 ---------- */
.chat-head { position: relative; }
.tasks-btn {
  background: #fff; color: var(--text2); border: 1px solid var(--border2);
  border-radius: 6px; padding: 3px 10px; font-size: 11.5px; cursor: pointer;
  display: none; align-items: center; gap: 5px;
}
.tasks-btn.show { display: inline-flex; }
.tasks-btn:hover { border-color: var(--green); color: var(--green); }
.tasks-count { background: var(--green); color: #fff; border-radius: 999px; font-size: 10px; padding: 0 5px; line-height: 15px; }
.tasks-count.hot { background: var(--amber); }
.tasks-panel {
  position: absolute; top: 44px; right: 16px; z-index: 50;
  width: 400px; max-height: 420px; overflow-y: auto;
  background: #fff; border: 1px solid var(--border2); border-radius: 12px;
  box-shadow: 0 12px 32px rgba(15,23,42,.18);
  display: none;
}
.tasks-panel.open { display: block; }
.tasks-panel h4 { font-size: 12px; color: var(--text2); padding: 10px 14px 6px; margin: 0; }
.task-item { padding: 9px 14px; border-top: 1px solid var(--border); cursor: pointer; }
.task-item:hover { background: var(--bg); }
.task-item .t1 { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
.task-item .t2 { font-size: 11px; color: var(--text3); margin-top: 3px; word-break: break-all; }
.task-item .t-act { margin-left: auto; flex: 0 0 auto; }
.task-stop {

<div id="toast"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);

// 浏览器里记住当前会话,刷新页面后自动恢复到刷新前打开的会话
const LS_SESSION_KEY = "mini_code.current_session";

const state = {
  sessions: [],
  current: null,      // 当前会话 id,null = 新会话
  running: false,     // 当前会话是否有活动任务(以服务端为准)
  pendingTask: null,  // 等待 session_created 的 task_id
  sending: false,     // 消息已发出、会话还没创建完(此期间不要用轮询重置 running)
  live: null,         // 当前流式输出块(DOM)
  pending: null,      // 等待模型首 token 的转圈块(DOM)
  ctxWindow: 0,       // 当前会话模型的上下文窗口(token)
  defaultCtxWindow: 0,// 默认模型的上下文窗口(新会话视图用)
  models: [],         // 已配置的模型列表(来自 /api/status)
  defaultModel: "",   // 默认模型名
  model: "",          // 当前会话的模型名;新会话视图下 = 下一条消息创建会话时使用的模型
  pendingImages: [],  // 待发送的截图 data URL(data:image/...;base64,...)
  mode: "full",       // 当前会话的权限模式;新会话视图下 = 下一条消息创建会话时使用的模式
  approvals: {},      // id → payload(待审批队列,跨会话)
  approvalShown: null,// 审批弹窗里正在展示的 id
  approvalTimer: null,
  children: [],       // 当前会话的子任务(子代理会话)摘要
};

/* ---------------- 截图(粘贴/选择 → 缩放 → 预览) ---------------- */
const MAX_IMAGES = 4;
const MAX_IMAGE_DIM = 1280;      // 前端缩放到这个尺寸,控制 base64 体积和 token
const MAX_IMAGE_BYTES = 4 * 1024 * 1024; // 单张 data URL 上限(前端先拦一道)

// 把图片文件缩放后转成 data URL。PNG 且不大时保留原格式(截图常带透明通道),
// 否则统一压成 JPEG 0.85(体积最小)。
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX_IMAGE_DIM || h > MAX_IMAGE_DIM) {
        const k = Math.min(MAX_IMAGE_DIM / w, MAX_IMAGE_DIM / h);
        w = Math.round(w * k); h = Math.round(h * k);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, h); // JPEG 无透明通道,先铺白底
      ctx.drawImage(img, 0, 0, w, h);
      const keepPng = file.type === "image/png" && file.size < 512 * 1024;
      const dataUrl = keepPng ? canvas.toDataURL("image/png")
                              : canvas.toDataURL("image/jpeg", 0.85);
      resolve(dataUrl);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("图片读取失败")); };
    img.src = url;
  });
}

async function addImageFiles(files) {
  for (const f of files) {
    if (!f || !f.type.startsWith("image/")) continue;
    if (state.pendingImages.length >= MAX_IMAGES) {
      toast("最多 " + MAX_IMAGES + " 张截图", "err");
      break;
    }
    try {
      const dataUrl = await fileToDataURL(f);
      if (dataUrl.length > MAX_IMAGE_BYTES) { toast("图片过大,已跳过", "err"); continue; }
      state.pendingImages.push(dataUrl);
    } catch (e) { toast(e.message, "err"); }
  }
  renderImgPreviews();
}

function renderImgPreviews() {
  const box = $("#img-previews");
  box.innerHTML = "";
  state.pendingImages.forEach((u, i) => {
    const d = document.createElement("div");
    d.className = "img-prev";
    d.innerHTML = '<img src="' + u + '" alt="截图">' +
      '<button class="rm" title="移除">×</button>';
    d.querySelector(".rm").addEventListener("click", () => {
      state.pendingImages.splice(i, 1);
      renderImgPreviews();
    });
    box.appendChild(d);
  });
  box.hidden = state.pendingImages.length === 0;
}

function readSavedSession() {
  try { return localStorage.getItem(LS_SESSION_KEY); } catch (e) { return null; }
}
function saveSession(id) {
  try { id ? localStorage.setItem(LS_SESSION_KEY, id) : localStorage.removeItem(LS_SESSION_KEY); } catch (e) {}
}

/* ---------------- 基础 ---------------- */
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.status + " " + r.statusText;
    try { const j = await r.json(); if (j.error) msg = j.error; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function toast(msg, kind) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show " + (kind || "");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ""; }, 4200);
}
function contentText(m) {
  if (typeof m.content === "string") return m.content;
  if (Array.isArray(m.content)) {
    return m.content.map(p => p.type === "text" ? (p.text || "") : "📷 [图片]").join("\n");
  }
  return "";
}
// 提取消息内容里的图片 data URL(多模态消息的 content 是 parts 数组)
function contentImages(m) {
  if (!Array.isArray(m.content)) return [];
  return m.content.filter(p => p.type === "image_url" && p.image_url && p.image_url.url)
                  .map(p => p.image_url.url);
}
function relTime(s) {
  if (!s) return "";
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
  return (d.getMonth() + 1) + "-" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

/* ---------------- 会话列表 ---------------- */
async function loadSessions(select) {
  try {
    state.sessions = await api("/api/sessions");
  } catch (e) { return; }
  renderSessions();
  syncRunning();
  if (state.current) loadChildren(); // 子任务状态随列表一起收敛
  if (select && select !== state.current) selectSession(select);
}
// SSE 事件是"有会话发生了变化"的信号:其他会话的事件不进入当前视图,
// 但触发一次防抖的列表刷新,让侧边栏状态在秒级收敛(而不是等 30s 轮询)。
let listRefreshTimer = null;
function scheduleListRefresh(delay) {
  if (listRefreshTimer) return;
  listRefreshTimer = setTimeout(() => {
    listRefreshTimer = null;
    loadSessions();
  }, delay == null ? 1500 : delay);
}
// 用服务端状态校准当前会话的执行状态:
// - 页面刷新 / SSE 漏掉终结事件后,停止按钮与运行指示都能自动恢复或收敛;
// - 会话刚发出消息、session_created 还没回来时(sending),不做降级。
function syncRunning() {
  if (!state.current) {
    // 消息刚发出、会话还没创建完:保持 running,等 session_created 接管
    if (!state.sending && !state.pendingTask) setRunning(false);
    return;
  }
  const s = state.sessions.find(x => x.session_id === state.current);
  if (!s) return;
  setRunning(!!s.active);
}
function renderSessions() {
  const list = $("#sess-list");
  list.innerHTML = "";
  if (state.sessions.length === 0) {
    list.innerHTML = '<div class="empty-hint">暂无会话<br>发送第一条消息开始</div>';
    return;
  }
  for (const s of state.sessions) {
    const el = document.createElement("div");
    el.className = "sess-item" + (s.session_id === state.current ? " active" : "");
    // 执行中只看服务端的 active 标志(本进程是否有活动任务):
    // 持久化的 status 在进程崩溃/重启后可能停留在 "running",不可信。
    const dotClass = s.active ? "running" : (["completed", "failed", "interrupted"].includes(s.status) ? s.status : "idle");
    const statusText = s.active ? "执行中" : { completed: "已完成", failed: "失败", interrupted: "已中断" }[s.status] || "";
    el.innerHTML =
      '<div class="sess-title">' + esc(s.title || "未命名会话") + '</div>' +
      '<div class="sess-meta"><span class="s ' + dotClass + '"></span>' +
      (s.mode === "cautious" ? '<span title="谨慎模式">🛡</span>' : "") +
      (statusText ? "<span>" + statusText + "</span>" : "") +
       "<span>" + relTime(s.updated_at) + "</span><span>" + s.message_count + " 条</span></div>" +
       '<button class="rename-btn" title="重命名会话">✎</button>' +
       '<button class="del-btn" title="删除会话">✕</button>';
    el.addEventListener("click", (e) => {
      if (e.target.classList.contains("del-btn") || e.target.classList.contains("rename-btn")) return;
      selectSession(s.session_id);
    });
    el.querySelector(".rename-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      renameSession(s.session_id, s.title);
    });
    el.querySelector(".del-btn").addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm("确定删除该会话?(消息将一并删除)")) return;
      try {
        await api("/api/sessions/" + s.session_id, { method: "DELETE" });
        if (state.current === s.session_id) resetToNew();
        await loadSessions();
        toast("会话已删除", "ok");
      } catch (err) { toast("删除失败:" + err.message, "err"); }
    });
    list.appendChild(el);
  }
}

/* ---------------- 会话重命名 ---------------- */
async function renameSession(id, currentTitle) {
  const t = prompt("重命名会话", currentTitle || "");
  if (t == null) return; // 取消
  const title = t.trim();
  if (!title) { toast("标题不能为空", "err"); return; }
  if ([...title].length > 60) { toast("标题过长(最多 60 字)", "err"); return; }
  try {
    const r = await api("/api/sessions/" + id + "/rename", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title }),
    });
    const s = state.sessions.find(x => x.session_id === id);
    if (s) s.title = r.title;
    if (state.current === id) setChatTitle(r.title, s ? (s.work_dir || "").slice(0, 60) : "");
    renderSessions();
    toast("已重命名", "ok");
  } catch (err) { toast("重命名失败:" + err.message, "err"); }
}

/* ---------------- 消息区 ---------------- */
function messagesEl() { return $("#messages"); }
function scrollBottom() {
  const m = messagesEl();
  m.scrollTop = m.scrollHeight;
}
function hidePlaceholder() {
  const p = $("#placeholder");
  if (p) p.style.display = "none";
}
function showPlaceholder() {
  const m = messagesEl();
  if (m.children.length === 0) {
    m.innerHTML = '<div class="placeholder" id="placeholder"><div class="big">💬</div><p>发送消息开始对话,新会话将自动创建</p></div>';
  }
}
function addCard(cls, inner) {
  hidePlaceholder();
  const m = messagesEl();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = "<div class=\"m-card\">" + inner + "</div>";
  m.appendChild(div);
  scrollBottom();
  return div;
}
function addUser(text, images) {
  let inner = '<div class="m-head"><span class="m-tag user">你</span></div>';
  if (text) inner += '<div class="m-text">' + esc(text) + "</div>";
  if (images && images.length) {
    inner += '<div class="msg-imgs">' +
      images.map(u => '<img src="' + u + '" alt="截图" title="点击放大">').join("") +
      "</div>";
  }
  addCard("user", inner);
}
// 点击聊天里的截图放大查看(简易全屏遮罩,再点关闭)
document.addEventListener("click", (e) => {
  const img = e.target.closest(".msg-imgs img");
  if (!img) return;
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.82);z-index:99;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:32px;";
  ov.innerHTML = '<img style="max-width:100%;max-height:100%;border-radius:8px;" alt="截图">';
  ov.querySelector("img").src = img.src;
  ov.addEventListener("click", () => ov.remove());
  document.body.appendChild(ov);
});
function addAssistant(text, reasoning) {
  let inner = '<div class="m-head"><span class="m-tag ai">Mini Code</span></div>';
  if (reasoning) {
    inner += '<details class="m-think"><summary>💭 思考过程(' + reasoning.length + ' 字)</summary><div class="think-body">' + esc(reasoning) + "</div></details>";
  }
  if (text) inner += '<div class="m-text">' + esc(text) + "</div>";
  addCard("ai", inner);
}
function addError(text) {
  addCard("error", '<div class="m-text">⚠ 任务失败:' + esc(text) + "</div>");
}
function addStatus(text) {
  addCard("status", '<div class="m-text">' + esc(text) + "</div>");
}
function addToolLine(name, args, result) {
  const a = args ? ' <span class="t-args">' + esc(String(args).slice(0, 160)) + "</span>" : "";
  const r = result != null
    ? '<div class="t-res">✓ ' + esc(String(result).slice(0, 300)) + "</div>"
    : '<span class="live-ind"><span class="pulse gray"></span>运行中…</span>';
  addCard("tool", '<span class="t-name">⚙ ' + esc(name) + "</span>" + a + r);
}
function markToolPendingDone(result) {
  const cards = messagesEl().querySelectorAll(".msg.tool .m-card");
  if (cards.length === 0) return;
  const last = cards[cards.length - 1];
  const ind = last.querySelector(".live-ind");
  if (ind) ind.remove();
  last.insertAdjacentHTML("beforeend", '<div class="t-res">✓ ' + esc(String(result).slice(0, 300)) + "</div>");
  scrollBottom();
}
function renderHistory(messages) {
  const m = messagesEl();
  m.innerHTML = "";
  for (const msg of messages || []) {
    if (msg.role === "system") continue;
    if (msg.role === "user") {
      // 多模态用户消息:文字取 text part(不再显示"📷 [图片]"占位),图片单独渲染
      const imgs = contentImages(msg);
      const txt = Array.isArray(msg.content)
        ? msg.content.filter(p => p.type === "text").map(p => p.text || "").join("\n")
        : contentText(msg);
      addUser(txt, imgs);
    } else if (msg.role === "assistant") {
      addAssistant(contentText(msg), msg.reasoning_content);
      for (const tc of msg.tool_calls || []) {
        addToolLine(tc.function && tc.function.name, tc.function && tc.function.arguments, "(历史)");
      }
    } else if (msg.role === "tool") {
      addToolLine(msg.name || "tool", "", contentText(msg));
    }
  }
  if ((messages || []).length === 0) showPlaceholder();
}

/* ---------------- 等待首 token(转圈) ---------------- */
function pendingStart() {
  pendingRemove();
  hidePlaceholder();
  const t0 = Date.now();
  const div = document.createElement("div");
  div.className = "msg pending";
  div.innerHTML =
    '<div class="m-card">' +
    '<span class="spinner"></span>' +
    '<span>等待模型响应…(大上下文首次推理可能较慢)</span>' +
    '<span class="pending-sec"></span>' +
    "</div>";
  messagesEl().appendChild(div);
  div._timer = setInterval(() => {
    const el = div.querySelector(".pending-sec");
    if (el) el.textContent = Math.floor((Date.now() - t0) / 1000) + "s";
  }, 1000);
  state.pending = div;
  scrollBottom();
}
function pendingRemove() {
  if (state.pending) {
    clearInterval(state.pending._timer);
    state.pending.remove();
    state.pending = null;
  }
}

/* ---------------- 流式输出块 ---------------- */
function liveStart() {
  if (state.live) return;
  pendingRemove(); // 收到首个 token,撤掉转圈
  hidePlaceholder();
  const m = messagesEl();
  const div = document.createElement("div");
  div.className = "msg ai";
  div.innerHTML =
    '<div class="m-card">' +
    '<div class="m-head"><span class="m-tag ai">Mini Code</span><span class="live-ind"><span class="pulse"></span>思考中…</span></div>' +
    '<div class="m-think-live"></div>' +
    '<div class="m-text" style="display:none"></div>' +
    "</div>";
  m.appendChild(div);
  state.live = div;
  scrollBottom();
}
function liveUpdate(kind, text) {
  if (!state.live) return;
  if (kind === "reasoning") {
    const t = state.live.querySelector(".m-think-live");
    t.textContent = text;
    t.style.display = "block";
    t.scrollTop = t.scrollHeight;
  } else {
    const b = state.live.querySelector(".m-card > .m-text");
    b.textContent = text;
    b.style.display = "block";
    // 正文开始后,指示器从"思考中"切到"生成中"
    const ind = state.live.querySelector(".live-ind");
    if (ind && !b._labelled) { ind.lastChild.textContent = "生成中…"; b._labelled = true; }
  }
  scrollBottom();
}
function liveRemove() {
  if (state.live) { state.live.remove(); state.live = null; }
}
// 把流式块固化为一条普通消息(用于工具调用前已产生的中间回复)
function liveCommit() {
  if (!state.live) return;
  const think = state.live.querySelector(".m-think-live");
  const body = state.live.querySelector(".m-card > .m-text");
  const r = think.textContent || "";
  const c = body.textContent || "";
  state.live.remove();
  state.live = null;
  if (!r && !c) return;
  addAssistant(c, r);
}

/* ---------------- 发送 / 停止 ---------------- */
function setRunning(on) {
  state.running = on;
  // btn-stop is hidden by CSS (display:none), so showing it requires an
  // explicit display value — clearing the inline style would fall back to
  // the CSS rule and keep it hidden.
  $("#btn-send").style.display = on ? "none" : "";
  $("#btn-stop").style.display = on ? "inline-block" : "none";
  compactBtnState();
  renderSessions();
}
function compactBtnState() {
  const b = $("#btn-compact");
  b.disabled = !state.current || state.running || !!b._busy;
}
async function send() {
  const input = $("#input");
  const text = input.value.trim();
  const images = state.pendingImages.slice();
  if ((!text && images.length === 0) || state.running) return;
  input.value = "";
  autoGrow();
  liveCommit();
  addUser(text, images);
  state.pendingImages = [];
  renderImgPreviews();
  pendingStart(); // 等待模型首 token 的转圈提示(vllm 吞长上下文时可见)
  setRunning(true);
  state.sending = true; // 新会话场景:session_created 回来前,轮询不得重置 running
  try {
    const body = { content: text };
    if (images.length) body.images = images;
    if (state.current) body.session_id = state.current;
    else {
      body.mode = state.mode;   // 新会话:按当前选择的权限模式创建
      body.model = state.model; // 新会话:按当前选择的模型创建
    }
    const r = await api("/api/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!state.current) state.pendingTask = r.task_id;
  } catch (e) {
    addError("发送失败:" + e.message);
    setRunning(false);
  } finally {
    state.sending = false;
  }
}
async function stop() {
  if (!state.current) { toast("会话尚未创建,无法停止", "err"); return; }
  try {
    const r = await api("/api/sessions/" + state.current + "/cancel", { method: "POST" });
    if (r.canceled) {
      toast("已发送停止请求", "ok");
    } else {
      // 服务端没有活动任务(状态可能已经收尾):同步本地,别再留停止按钮
      toast("该会话当前没有正在执行的任务", "");
      setRunning(false);
    }
  } catch (e) { toast("停止失败:" + e.message, "err"); }
}

/* ---------------- SSE 事件 ---------------- */
function onEvent(m) {
  // 审批事件跨会话(子代理/其他会话的危险操作也要用户拍板),先于会话过滤处理
  if (m.kind === "approval_request") {
    try { onApprovalRequest(JSON.parse(m.content)); } catch (e) {}
    return;
  }
  if (m.kind === "approval_resolved") {
    try { onApprovalResolved(JSON.parse(m.content)); } catch (e) {}
    return;
  }
  if (m.kind === "status" && m.status === "session_created") {
    if (!state.sessions.some(s => s.session_id === m.session_id)) {
      state.sessions.unshift({ session_id: m.session_id, title: "新会话", status: "created", message_count: 0 });
    }
    if (m.task_id && m.task_id === state.pendingTask) {
      state.pendingTask = null;
      state.current = m.session_id;  // 本地视图已包含用户消息,不重新拉历史
      saveSession(m.session_id);
      setChatTitle("会话 " + m.session_id.slice(0, 8), "");
      renderSessions();
      paintTokens(0);
      compactBtnState();
      paintMode();
      paintModel(); // 会话已创建:按钮提示从"新会话"切到"当前会话模型"
      paintBackBtn("");
      loadChildren();
      // hub 在 session_created 之后才登记任务(注册 + 写 status=running 都是
      // 立即的),稍等再拉一次列表,侧边栏就能尽快显示"执行中"。
      // 不立即拉:此刻 active 可能还没置位,会误闪一下停止按钮。
      setTimeout(loadSessions, 1000);
    } else {
      // 别的渠道(如钉钉)新建的会话:侧边栏立即可见,随后补齐真实状态
      renderSessions();
      scheduleListRefresh(1000);
    }
    return;
  }
  // 严格按会话隔离:其他会话的事件(包括当前停在新会话视图时)一律不写入
  // 当前视图、不影响 running 状态;只当作列表变化信号,防抖刷新侧边栏。
  if (m.session_id && m.session_id !== state.current) {
    scheduleListRefresh();
    return;
  }
  // 到达这里的会话事件都属于当前会话(上方已按 session_id 严格过滤)
  switch (m.kind) {
    case "reasoning_delta":
      liveStart();
      liveUpdate("reasoning", m.reasoning || m.content);
      break;
    case "content_delta":
      liveStart();
      liveUpdate("content", m.content);
      break;
    case "tool_start":
      pendingRemove();
      liveCommit();
      addToolLine(m.tool_name, m.tool_args);
      break;
    case "tool_end":
      markToolPendingDone(m.tool_result);
      break;
    case "assistant":
      pendingRemove();
      liveRemove();
      if (m.content || m.reasoning) addAssistant(m.content, m.reasoning);
      setRunning(false);
      updateTokenUsage();
      loadSessions();
      break;
    case "error":
      pendingRemove();
      liveRemove();
      addError(m.content);
      setRunning(false);
      updateTokenUsage();
      loadSessions();
      break;
    case "status":
      if (m.status === "interrupted") {
        pendingRemove();
        liveRemove();
        addStatus("⏹ 任务已中断(已保留进度,可继续发送消息)");
        setRunning(false);
      } else if (m.status === "task_done") {
        pendingRemove();
        liveRemove();
        setRunning(false);
      }
      updateTokenUsage();
      loadSessions();
      break;
  }
}
function connectEvents() {
  const es = new EventSource("/api/events");
  es.onmessage = (e) => {
    try { onEvent(JSON.parse(e.data)); } catch (err) {}
  };
  es.onerror = () => { /* EventSource 自动重连 */ };
}

/* ---------------- 审批(谨慎模式) ---------------- */
function approvalBadge() {
  const n = Object.keys(state.approvals).length;
  $("#btn-approval-badge").classList.toggle("show", n > 0);
  $("#approval-count").textContent = n;
}
function onApprovalRequest(p) {
  if (!p || !p.id || state.approvals[p.id]) return;
  state.approvals[p.id] = p;
  approvalBadge();
  if (!state.approvalShown) showApproval(p.id);
}
function onApprovalResolved(p) {
  if (!p || !p.id) return;
  const had = !!state.approvals[p.id];
  delete state.approvals[p.id];
  approvalBadge();
  if (state.approvalShown === p.id) {
    hideApproval();
    toast(p.approved ? "已批准:" + (p.reason || "") : "已拒绝:" + (p.reason || ""), p.approved ? "ok" : "");
  } else if (had) {
    toast((p.approved ? "已批准 " : "已拒绝 ") + (p.reason || ""), "");
  }
  if (!state.approvalShown && Object.keys(state.approvals).length) {
    showApproval(Object.keys(state.approvals)[0]);
  }
}
function showApproval(id) {
  const p = state.approvals[id];
  if (!p) return;
  state.approvalShown = id;
  let sess = esc(p.title || "会话 " + (p.session_id || "").slice(0, 8));
  if (p.parent_id) {
    sess += " <span style='color:var(--text3)'>· 子任务(父:" + esc(p.parent_title || p.parent_id.slice(0, 8)) + ")</span>";
  }
  $("#ap-sess").innerHTML = "来源:" + sess;
  let args = p.args || "";
  try { args = JSON.stringify(JSON.parse(args), null, 2); } catch (e) {}
  $("#ap-tool").innerHTML = '<span class="ap-tname">' + esc(p.tool_name) + "</span>\n" + esc(args);
  $("#approval-mask").classList.add("open");
  clearInterval(state.approvalTimer);
  const tick = () => {
    if (state.approvalShown !== id) { clearInterval(state.approvalTimer); return; }
    const left = Math.max(0, Math.round((new Date(p.deadline) - Date.now()) / 1000));
    $("#ap-deadline").textContent = "超时自动拒绝 · 剩余 " + Math.floor(left / 60) + " 分 " + (left % 60) + " 秒";
    if (left <= 0) clearInterval(state.approvalTimer);
  };
  tick();
  state.approvalTimer = setInterval(tick, 1000);
}
function hideApproval() {
  state.approvalShown = null;
  clearInterval(state.approvalTimer);
  $("#approval-mask").classList.remove("open");
}
async function decideApproval(id, decision) {
  try {
    await api("/api/approvals/" + id + "/decision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision }),
    });
  } catch (e) {
    toast("审批提交失败:" + e.message, "err");
    syncApprovals(); // 可能已超时:与服务端对账
  }
}
// 页面加载 / 漏事件后与服务端对账:服务端为准
async function syncApprovals() {
  try {
    const list = await api("/api/approvals");
    const serverIds = new Set(list.map(p => p.id));
    for (const id of Object.keys(state.approvals)) {
      if (!serverIds.has(id)) {
        delete state.approvals[id];
        if (state.approvalShown === id) hideApproval();
      }
    }
    for (const p of list) onApprovalRequest(p);
    approvalBadge();
  } catch (e) {}
}

/* ---------------- 子任务(子代理)面板 ---------------- */
async function loadChildren() {
  if (!state.current) { state.children = []; renderTasksPanel(); return; }
  try {
    state.children = await api("/api/sessions/" + state.current + "/children");
  } catch (e) { state.children = []; }
  renderTasksPanel();
}
function renderTasksPanel() {
  const btn = $("#btn-tasks");
  const kids = state.children || [];
  const running = kids.filter(c => c.active).length;
  btn.classList.toggle("show", !!state.current && kids.length > 0);
  const cnt = $("#tasks-count");
  cnt.textContent = running > 0 ? running : kids.length;
  cnt.classList.toggle("hot", running > 0);
  const panel = $("#tasks-panel");
  if (!panel.classList.contains("open")) return;
  if (kids.length === 0) {
    panel.innerHTML = "<h4>子任务</h4><div class='empty-hint'>暂无子任务</div>";
    return;
  }
  panel.innerHTML = "<h4>子任务(点击打开子会话)</h4>" + kids.map(c => {
    const dot = c.active ? "running" : (["completed", "failed", "interrupted"].includes(c.status) ? c.status : "idle");
    const st = c.active ? "执行中" : { completed: "已完成", failed: "失败", interrupted: "已中断" }[c.status] || "";
    const stop = c.active ? '<button class="task-stop">停止</button>' : "";
    return '<div class="task-item" data-id="' + c.session_id + '">' +
      '<div class="t1"><span class="s ' + dot + '"></span>' + esc(c.title || c.session_id.slice(0, 8)) +
      (st ? " <span style='color:var(--text3);font-weight:400'>" + st + "</span>" : "") +
      '<span class="t-act">' + stop + "</span></div>" +
      '<div class="t2">' + esc(c.session_id.slice(0, 12)) + " · " + relTime(c.updated_at) + "</div></div>";
  }).join("");
  panel.querySelectorAll(".task-item").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.classList.contains("task-stop")) {
        e.stopPropagation();
        stopTask(el.dataset.id);
        return;
      }
      closeTasksPanel();
      selectSession(el.dataset.id);
    });
  });
}
function toggleTasksPanel() {
  const p = $("#tasks-panel");
  if (p.classList.contains("open")) { closeTasksPanel(); return; }
  p.classList.add("open");
  loadChildren();
}
function closeTasksPanel() { $("#tasks-panel").classList.remove("open"); }
async function stopTask(id) {
  try {
    const r = await api("/api/sessions/" + id + "/cancel", { method: "POST" });
    toast(r.canceled ? "已发送停止请求" : "该子任务当前没有正在执行的任务", r.canceled ? "ok" : "");
    loadChildren();
  } catch (e) { toast("停止失败:" + e.message, "err"); }
}

async function openSettings() {

  // 模型列表草稿(服务端加载时已保证 models 非空)
  modelDraft = (cfg.models && cfg.models.length ? cfg.models : [cfg.model || {}]).map(m =>
    Object.assign(modelTemplate(), m));
  if (!modelDraft.length) modelDraft = [modelTemplate()];
  renderModelCards();
  $("#c-default-model").value = cfg.default_model || modelDraft[0].name || "";
  $("#c-compaction").checked = cfg.compaction_enabled !== false; // 缺省 = 开启
  $("#d-enabled").checked = !!D.enabled;
  $("#d-appkey").value = D.app_key || "";
  $("#d-appsecret").value = D.app_secret || "";
  $("#d-robotcode").value = D.robot_code || "";
  $("#d-allow").value = (D.allow_staff || []).join(", ");
  $("#d-interval").value = D.progress_interval || "";
  $("#w-port").value = cfg.web_port || "";
  $("#settings-mask").classList.add("open");
}
async function saveSettings() {
  const num = (v) => (v === "" ? 0 : Number(v));
  const models = modelDraft.map(m => ({
    name: (m.name || "").trim(),
    provider: (m.provider || "").trim(),
    base_url: (m.base_url || "").trim(),
    api_key: (m.api_key || "").trim(),
    model_name: (m.model_name || "").trim(),
    max_tokens: num(m.max_tokens),
    context_window: num(m.context_window),
    temperature: num(m.temperature),
    top_p: num(m.top_p),
    reserve_tokens: num(m.reserve_tokens),
  }));
  for (const m of models) {
    if (!m.name || !m.provider || !m.base_url || !m.model_name) {
      toast("每个模型都要填:显示名 / Provider / Base URL / Model Name", "err");
      return;
    }
  }
  const names = models.map(m => m.name);
  if (new Set(names).size !== names.length) { toast("模型显示名不能重复", "err"); return; }
  let defModel = $("#c-default-model").value;
  if (!names.includes(defModel)) defModel = names[0];
  const cfg = {
    web_port: num($("#w-port").value),
    models,
    default_model: defModel,
    compaction_enabled: $("#c-compaction").checked,
    dingtalk: {
      enabled: $("#d-enabled").checked,
      app_key: $("#d-appkey").value.trim(),
      app_secret: $("#d-appsecret").value.trim(),
      robot_code: $("#d-robotcode").value.trim(),
      allow_staff: $("#d-allow").value.split(",").map(s => s.trim()).filter(Boolean),
      progress_interval: num($("#d-interval").value),
    },
  };
  try {
    const r = await api("/api/config", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cfg),
    });
    let msg = r.message || "已保存";
    if (r.notes && r.notes.length) msg += "(" + r.notes.join(";") + ")";
    toast(msg, "ok");
    $("#settings-mask").classList.remove("open");
    loadStatus();
  } catch (e) {
    toast("保存失败:" + e.message, "err");
  }
}

/* ---------------- 输入框 ---------------- */
function autoGrow() {
  const i = $("#input");
  i.style.height = "auto";
  i.style.height = Math.min(i.scrollHeight, 160) + "px";
}
function setChatTitle(title, sub) {
  $("#chat-title").textContent = title;
  $("#chat-sub").textContent = sub || "";
}

/* ---------------- Token 用量(composer 下方) ---------------- */
function fmtK(n) {
  if (!n) return "—";
  if (n >= 1000) {
    const k = n / 1000;
    return (k >= 100 ? Math.round(k) : Math.round(k * 10) / 10) + "K";
  }
  return String(n);
}
function paintTokens(used) {
  const el = $("#token-usage");
  const cap = state.ctxWindow;
  if (!state.current) {
    el.textContent = "Token 0 / " + fmtK(cap);
    el.classList.remove("warn");
    return;
  }
  el.textContent = "Token " + (used || 0).toLocaleString() + " / " + fmtK(cap) +
    (cap ? " · " + Math.min(999, Math.round((used || 0) * 100 / cap)) + "%" : "");
  el.classList.toggle("warn", cap > 0 && (used || 0) / cap >= 0.8);
}
async function updateTokenUsage() {
  if (!state.current) { paintTokens(0); return; }
  try {
    const data = await api("/api/sessions/" + state.current);
    if (state.current !== data.session.session_id) return; // 已切走
    paintTokens(data.tokens);
  } catch (e) { /* 忽略:会话可能刚被删除 */ }
}
function resetToNew() {
  state.current = null;
  state.pendingTask = null;
  saveSession(null);
  // setRunning(false) 已负责按钮与侧边栏刷新,这里不再重复渲染
  setRunning(false); // 新会话没有运行中的任务;旧会话仍在跑的,点回它可恢复
  liveRemove();
  pendingRemove();
  messagesEl().innerHTML = "";
  showPlaceholder();
  setChatTitle("新会话", "发送后自动创建会话");
  state.mode = "full"; // 新会话默认完整模式
  state.model = state.defaultModel || ""; // 新会话默认模型
  state.ctxWindow = state.defaultCtxWindow;
  state.children = [];
  paintMode();
  paintModel();
  paintTokens(0);
  paintBackBtn("");
  closeTasksPanel();
  renderTasksPanel();
}
async function selectSession(id) {
  state.current = id;
  liveRemove();
  pendingRemove();
  try {
    const data = await api("/api/sessions/" + id);
    if (state.current !== id) return; // 等待期间又切走了,丢弃过期响应
    const s = data.session;
    setChatTitle(s.title || "会话 " + id.slice(0, 8), (s.work_dir || "").slice(0, 60));
    renderHistory(data.messages);
    // 权限模式:以服务端为准(谨慎/完整)
    state.mode = s.mode === "cautious" ? "cautious" : "full";
    paintMode();
    // 模型:以服务端为准(空 = 默认模型);token 条窗口跟着会话模型走
    state.model = s.model || state.defaultModel || "";
    if (data.context_window) state.ctxWindow = data.context_window;
    paintModel();
    paintBackBtn(s.parent_id);
    closeTasksPanel();
    loadChildren();
    // 执行状态以服务端为准:会话正在跑时恢复停止按钮,并提示任务仍在进行
    // (刷新页面不会中断服务端的任务)。setRunning 已同步按钮/侧边栏/压缩键。
    setRunning(!!s.active);
    if (s.active) {
      addStatus("⏳ 任务正在执行中 — 刷新前产生的输出不再回显,后续输出将实时显示");
    }
    paintTokens(data.tokens);
    saveSession(id);
  } catch (e) {
    toast("打开会话失败:" + e.message, "err");
  }
}

/* ---------------- @ 文件夹选择器 ---------------- */
const FS_RECENT_KEY = "mini_code.recent_paths";
const fsState = { open: false, hits: [], sel: 0, timer: null, seq: 0, indexing: false };

function fsRecent() {
  try { return JSON.parse(localStorage.getItem(FS_RECENT_KEY) || "[]"); } catch (e) { return []; }
}
function fsRemember(path) {
  try {
    const r = fsRecent().filter(p => p !== path);
    r.unshift(path);
    localStorage.setItem(FS_RECENT_KEY, JSON.stringify(r.slice(0, 8)));
  } catch (e) {}
}
// 光标前紧邻的 "@token"(token 以空白或文本开头分隔),无则 null。
function fsTokenAt(text, caret) {
  const before = text.slice(0, caret);
  const m = before.match(/@([^\s@]*)$/);
  if (!m) return null;
  const start = caret - m[0].length;
  if (start > 0 && !/\s/.test(text[start - 1])) return null; // 邮箱等场景不触发
  return { query: m[1], start };
}
function fsOpen(query) {
  fsState.open = true;
  fsState.sel = 0;
  $("#fs-picker").hidden = false;
  $("#fs-q").textContent = "@" + query;
  clearTimeout(fsState.timer);
  fsState.timer = setTimeout(() => fsDoFetch(query), 150);
}
function fsClose() {
  fsState.open = false;
  clearTimeout(fsState.timer);
  fsState.seq++; // 丢弃在途请求
  $("#fs-picker").hidden = true;
}
function fsCheckInput() {
  const input = $("#input");
  const tok = fsTokenAt(input.value, input.selectionStart);
  if (tok) fsOpen(tok.query);
  else if (fsState.open) fsClose();
}
async function fsDoFetch(query) {
  const seq = ++fsState.seq;
  let data;
  try {
    data = await api("/api/fs/search?q=" + encodeURIComponent(query) + "&limit=20");
  } catch (e) {
    if (seq === fsState.seq && fsState.open) fsRender(null, "搜索失败:" + e.message);
    return;
  }
  if (seq !== fsState.seq || !fsState.open) return;
  fsState.indexing = !!data.indexing;
  let hits = data.dirs || [];
  if (query === "") {
    // 最近使用过的路径置顶
    const rec = fsRecent().filter(p => !hits.some(h => h.path === p));
    hits = rec.map(p => ({
      path: p,
      name: p.split(/[\\/]/).filter(Boolean).pop() || p,
      parent: "",
    })).concat(hits);
  }
  fsState.hits = hits;
  fsState.sel = 0;
  fsRender(hits, null);
  if (data.indexing) {
    // 目录索引还没建完:1.5s 后自动重查一次
    fsState.timer = setTimeout(() => { if (fsState.open) fsDoFetch(query); }, 1500);
  }
}
function fsRender(hits, errMsg) {
  const list = $("#fs-list");
  if (errMsg) {
    list.innerHTML = '<div class="fs-empty">' + esc(errMsg) + "</div>";
    return;
  }
  if (!hits || hits.length === 0) {
    list.innerHTML = '<div class="fs-empty">' +
      (fsState.indexing ? "🔍 正在建立目录索引,稍候…" : "没有匹配的文件夹") + "</div>";
    return;
  }
  list.innerHTML = hits.map((h, i) =>
    '<div class="fs-item' + (i === fsState.sel ? " sel" : "") + '" data-i="' + i + '">' +
    '<div class="fs-name">📁 ' + esc(h.name) + "</div>" +
    (h.parent && h.parent !== h.path ? '<div class="fs-path">' + esc(h.parent) + "</div>" : "") +
    "</div>"
  ).join("");
  list.querySelectorAll(".fs-item").forEach(el => {
    el.addEventListener("mousedown", (e) => {
      e.preventDefault(); // 保持输入框焦点,避免点击时先失焦
      fsInsert(Number(el.dataset.i));
    });
  });
}
function fsMove(d) {
  if (!fsState.hits.length) return;
  fsState.sel = (fsState.sel + d + fsState.hits.length) % fsState.hits.length;
  $("#fs-list").querySelectorAll(".fs-item").forEach((el, i) => {
    el.classList.toggle("sel", i === fsState.sel);
    if (i === fsState.sel) el.scrollIntoView({ block: "nearest" });
  });
}
// 把命中的完整路径替换掉输入框里的 "@查询词"
function fsInsert(i) {
  const h = fsState.hits[i];
  if (!h) return;
  const input = $("#input");
  const caret = input.selectionStart;
  const tok = fsTokenAt(input.value, caret);
  const start = tok ? tok.start : caret;
  const before = input.value.slice(0, start);
  const after = input.value.slice(caret);
  input.value = before + h.path + " " + after;
  const pos = (before + h.path + " ").length;
  input.setSelectionRange(pos, pos);
  fsRemember(h.path);
  fsClose();
  autoGrow();
  input.focus();
}

/* ---------------- 初始化 ---------------- */
(async function init() {
  $("#btn-new").addEventListener("click", () => { resetToNew(); $("#input").focus(); });
  $("#btn-send").addEventListener("click", send);
  $("#btn-stop").addEventListener("click", stop);
  $("#input").addEventListener("keydown", (e) => {
    if (fsState.open) {
      if (e.key === "ArrowDown") { e.preventDefault(); fsMove(1); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); fsMove(-1); return; }
      if (e.key === "Escape") { e.preventDefault(); fsClose(); return; }
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (fsState.hits.length) fsInsert(fsState.sel);
        else { fsClose(); send(); } // 无命中:直接按原逻辑发送
        return;
      }
    }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $("#input").addEventListener("input", () => { autoGrow(); fsCheckInput(); });
  $("#input").addEventListener("blur", fsClose);
  // 粘贴截图:输入框里 Ctrl+V 直接取剪贴板里的图片
  $("#input").addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    const files = [];
    for (const it of items) {
      if (it.type && it.type.startsWith("image/")) {
        const f = it.getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) { e.preventDefault(); addImageFiles(files); }
  });
  $("#btn-plus").addEventListener("click", () => $("#file-shot").click());
  $("#file-shot").addEventListener("change", (e) => {
    addImageFiles(Array.from(e.target.files || []));
    e.target.value = "";
  });
  $("#btn-compact").addEventListener("click", async () => {
    if (!state.current || state.running) return;
    const b = $("#btn-compact");
    b._busy = true;
    b.disabled = true;
    b.textContent = "压缩中…";
    try {
      const r = await api("/api/sessions/" + state.current + "/compact", { method: "POST" });
      if (r.compressed) {
        toast("上下文已压缩:" + r.before.toLocaleString() + " → " + r.after.toLocaleString() +
          " tokens(释放 " + (r.before - r.after).toLocaleString() + ")", "ok");
      } else {
        toast("无需压缩:对话太短或没有可压缩的部分", "");
      }
      updateTokenUsage();
    } catch (e) {
      toast("压缩失败:" + e.message, "err");
    } finally {
      b._busy = false;
      b.textContent = "⚡ 压缩";
      compactBtnState();
    }
  });
  $("#btn-settings").addEventListener("click", openSettings);
  $("#btn-cancel").addEventListener("click", () => $("#settings-mask").classList.remove("open"));
  $("#btn-save").addEventListener("click", saveSettings);
  $("#settings-mask").addEventListener("click", (e) => {
    if (e.target.id === "settings-mask") e.target.classList.remove("open");
  });
  // 权限模式 / 子任务 / 审批
  $("#btn-mode").addEventListener("click", toggleMode);
  // 模型切换(composer 输入行内下拉)
  $("#btn-model").addEventListener("click", toggleModelMenu);
  // 设置弹窗:添加模型卡片
  $("#btn-add-model").addEventListener("click", () => {
    modelDraft.push(modelTemplate());
    renderModelCards();
    const cards = $("#model-list").querySelectorAll(".model-card");
    const last = cards[cards.length - 1];
    if (last) {
      last.scrollIntoView({ behavior: "smooth", block: "nearest" });
      const f = last.querySelector("input");
      if (f) f.focus();
    }
  });
  // 双击聊天头标题重命名当前会话
  $("#chat-title").addEventListener("dblclick", () => {
    if (!state.current) return;
    const s = state.sessions.find(x => x.session_id === state.current);
    renameSession(state.current, s ? s.title : "");
  });
  $("#btn-tasks").addEventListener("click", toggleTasksPanel);
  document.addEventListener("click", (e) => {
    const p = $("#tasks-panel");
    if (p.classList.contains("open") && !p.contains(e.target) && e.target.id !== "btn-tasks") closeTasksPanel();
    // 点模型按钮/菜单之外时收起模型下拉
    const wrap = $("#model-menu").closest(".model-menu-wrap");
    if ($("#model-menu").classList.contains("open") && !wrap.contains(e.target)) closeModelMenu();
  });
  $("#btn-approval-badge").addEventListener("click", () => {
    const ids = Object.keys(state.approvals);
    if (ids.length) showApproval(ids[0]);
  });
  $("#ap-approve").addEventListener("click", () => { if (state.approvalShown) decideApproval(state.approvalShown, "approve"); });
  $("#ap-deny").addEventListener("click", () => { if (state.approvalShown) decideApproval(state.approvalShown, "deny"); });
  $("#approval-mask").addEventListener("click", (e) => {
    if (e.target.id === "approval-mask") hideApproval(); // 只是收起视图,请求仍待审批
  });

  await loadSessions();
  loadStatus();
  connectEvents();
  paintMode();
  syncApprovals(); // 页面刷新后同步未决审批
  // 刷新页面后恢复之前打开的会话(含其执行状态);会话已删除则丢弃记录
  const saved = readSavedSession();
  if (saved) {
    if (state.sessions.some(s => s.session_id === saved)) selectSession(saved);
    else saveSession(null);
  }
  setInterval(loadStatus, 30000);
  // 定期轮询:校准会话列表,并把当前会话的执行状态同步回服务端
  // (运行中也不跳过,这样 SSE 漏掉终结事件时停止按钮能自动收敛)
  setInterval(() => {
    loadSessions();
    updateTokenUsage();
    syncApprovals();
  }, 30000);
  $("#input").focus();
})();
</script>
</body>
